# Docker Compose for ROS Development
# Use: ROS_DISTRO=humble docker-compose up -d
# Supported: humble, iron, jazzy

version: '3.8'

services:
  ros-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
    container_name: momentum-ros-${ROS_DISTRO:-humble}
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Mount source code for live editing
    volumes:
      - .:/home/ros/ws/src/repository
      - ros-build:/home/ros/ws/build
      - ros-install:/home/ros/ws/install
    
    # Environment
    environment:
      - ROS_DOMAIN_ID=0
      - WORKSPACE=/home/ros/ws
      - ROS_DISTRO=${ROS_DISTRO:-humble}
    
    # Network
    network_mode: host
    
    # Run interactive shell
    command: /bin/bash

volumes:
  ros-build:
  ros-install:
