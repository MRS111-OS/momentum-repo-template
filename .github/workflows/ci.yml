name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read

env:
  ROS_DISTRO: humble  # Options: humble, iron, jazzy
  UBUNTU_VERSION: "22.04"

jobs:
  python-tests:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
     - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
         python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run Python tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: python-tests
        name: python-coverage

  lint:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Lint with flake8
      run: |
        # Stop on errors, warn on style issues
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Check code formatting with black
      run: |
        black --check src/ tests/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/

  ros-tests:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build ROS ${{ env.ROS_DISTRO }} test image
      run: |
        docker build -f Dockerfile.testing \
          --build-arg ROS_DISTRO=${{ env.ROS_DISTRO }} \
          -t momentum-test:${{ env.ROS_DISTRO }} .
    
    - name: Create test results directory
      run: mkdir -p test-results
    
    - name: Run ROS tests in Docker
      run: |
        docker run --rm \
          -v $(pwd)/test-results:/test-results \
          momentum-test:${{ env.ROS_DISTRO }}
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ros-test-results-${{ env.ROS_DISTRO }}
        path: test-results/
        retention-days: 30
    
    - name: Display test summary
      if: always()
      run: |
        echo "=== Test Results Summary (ROS ${{ env.ROS_DISTRO }}) ===" && \
        if [ -f test-results/test-results.txt ]; then cat test-results/test-results.txt; fi && \
        if [ -f test-results/pytest.log ]; then echo "=== Python tests:"; tail -20 test-results/pytest.log; fi
